name: Daily Temperature Forecast

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so pushing commits succeeds cleanly
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies and synoptic package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Execute Live Operational Forecast
        id: run_forecast
        run: |
          python predict_tomorrow.py | tee forecast_output.txt

      - name: Publish Step Summary
        if: always()
        run: |
          echo "### 🏴󠁧󠁢󠁳󠁣󠁴󠁿 Operational Weather Forecast" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat forecast_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Commit and Push Updated Artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Use -f to force-stage artifacts ignored by root .gitignore
          git add -f data/weather_history.csv models/model_bundle.joblib

          # Check for changes before committing; [skip ci] prevents recursive triggers
          if ! git diff --staged --quiet; then
            git commit -m "chore(automation): sync model weights and weather history [skip ci]"
            git push origin main
          else
            echo "No artifact changes detected. Skipping push."
          fi

      - name: Post Alert to Discord (Optional)
        if: env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          PAYLOAD=$(python -c '
          import json
          with open("forecast_output.txt") as f:
              text = f.read()
          print(json.dumps({"content": f"```text\n{text}\n```"}))
          ')
          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"
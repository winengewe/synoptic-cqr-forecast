[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synoptic-cqr-forecast"
version = "0.1.0"
description = "Synoptic-aware temperature forecasting with Conformalized Quantile Regression"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.0",
    "shap>=0.44.0",
    "requests>=2.31.0",
    "matplotlib>=3.8.0",
    "joblib>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
version: '3.8'

services:
  forecast:
    build: .
    container_name: synoptic_forecast
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["python", "predict_tomorrow.py"]

  train:
    build: .
    container_name: synoptic_train
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["python", "main.py"]
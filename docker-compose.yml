version: '3.8'

services:
  forecast:
    build: .
    container_name: synoptic_forecast
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["python", "predict_tomorrow.py"]

  train:
    build: .
    container_name: synoptic_train
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["python", "main.py"]

  dashboard:
    build: .
    container_name: synoptic_dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
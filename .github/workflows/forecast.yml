name: Daily Temperature Forecast

on:
  schedule:
    # Triggers daily at 00:15 UTC to ingest the previous day's finalized 23:00 readings
    - cron: '15 0 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies and synoptic package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Restore data and model caches
        uses: actions/cache@v4
        with:
          path: |
            data/weather_history.csv
            models/model_bundle.joblib
          key: synoptic-artifacts-${{ hashFiles('src/synoptic_forecast/**', 'pyproject.toml') }}
          restore-keys: |
            synoptic-artifacts-

      - name: Execute Live Operational Forecast
        id: run_forecast
        run: |
          python predict_tomorrow.py | tee forecast_output.txt

      - name: Publish Step Summary
        if: always()
        run: |
          echo "### 🏴󠁧󠁢󠁳󠁣󠁴󠁿 Operational Weather Forecast" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat forecast_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Post Alert to Discord (Optional)
        if: env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          PAYLOAD=$(python -c '
          import json
          with open("forecast_output.txt") as f:
              text = f.read()
          print(json.dumps({"content": f"```text\n{text}\n```"}))
          ')
          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"